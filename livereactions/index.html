<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess the Gesture</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>
  <div class="app">
    <h1>Guess the Gesture</h1>
    <p class="subtitle">There are 7 hidden gestures. Try different hand movements in front of the camera and see how many you can find!</p>

    <!-- här hamnar canvasen, "light" gör att ringlampan är på från början -->
    <div id="camera" class="camera-box light"></div>

    <!-- poäng och rutorna med ? -->
    <p class="score">Found: <span id="count">0 / 7</span></p>
    <div id="board" class="board"></div>

    <div class="buttons">
      <button onclick="showHint()">Hint</button>
      <button onclick="restart()">Restart</button>
      <button onclick="toggleLight()">Ring light</button>
    </div>

    <!-- här visas ledtrådar -->
    <p id="hint" class="hint"></p>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
